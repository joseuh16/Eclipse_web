# Base de datos local de Eclipse Tech.
#
#   docker compose up -d mysql
#
# La API en desarrollo (backend/Eclipse.Api/appsettings.Development.json)
# espera MySQL en 127.0.0.1:3307. El puerto se puede cambiar con
# MYSQL_EXPOSED_PORT en el archivo .env.

name: eclipse-tech

services:
  mysql:
    image: mysql:8.0
    container_name: eclipse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eclipse}
      MYSQL_USER: ${MYSQL_USER:-eclipse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eclipse_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eclipse_root_password}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "127.0.0.1:${MYSQL_EXPOSED_PORT:-3307}:3306"
    volumes:
      - eclipse-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - eclipse-net

volumes:
  eclipse-mysql-data:
    name: eclipse-mysql-data

networks:
  eclipse-net:
    name: eclipse-net
